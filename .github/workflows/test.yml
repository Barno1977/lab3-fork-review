name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v3

    - name: Run automated tests
      run: |
        echo "Запуск тестов..."
        if grep -q "FAIL" test_hook.txt; then
          echo "❌ Тесты провалены! Найдена ошибка."
          exit 1
        else
          echo "✅ Все тесты успешно пройдены!"
          exit 0
        fi